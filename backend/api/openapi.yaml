openapi: 3.0.3
info:
  title: DVO API
  version: 0.1.0
  description: DVO 백엔드 API 계약. 프론트는 이 문서를 기준으로 연동한다. (인증 없는 로컬 개발용 1차)
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      summary: 생존 확인
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/v1/config:
    get:
      summary: 정적 게임 데이터 일괄 조회 (앱 시작 시 1회)
      responses:
        "200":
          description: 타일 정의, 몬스터, 수치, 아이템
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameConfig"
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/dev/users:
    post:
      summary: 개발용 임시 사용자 생성 (DVO_DEV_ENDPOINTS=1 일 때만 제공, 인증 도입 시 제거)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 32 }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
        "400":
          description: 이름이 비었거나 너무 길거나 알 수 없는 필드 (invalid_name, invalid_body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 이름 중복 (name_taken)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/users/{id}/save:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: 세이브 조회 (DVO_DEV_ENDPOINTS=1 일 때만 제공)
      responses:
        "200":
          description: 저장된 진행 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Save"
        "400":
          description: 잘못된 id (invalid_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 세이브 없음 (not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: 세이브 저장 (사용자당 1건, 덮어쓰기)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Save"
      responses:
        "200":
          description: 저장됨 (updatedAt 포함)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Save"
        "400":
          description: 값 범위 오류 또는 알 수 없는 필드 (invalid_id, invalid_save, invalid_body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 사용자 없음 (not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Save:
      type: object
      required: [hp, maxHp, mp, maxMp, gold, level, exp, weapon, position]
      description: 플레이어 진행 상태. 0 ≤ hp ≤ maxHp, 0 ≤ mp ≤ maxMp, level ≥ 1, 0 ≤ position < 보드 칸 수.
      properties:
        hp: { type: integer, minimum: 0 }
        maxHp: { type: integer, minimum: 1 }
        mp: { type: integer, minimum: 0 }
        maxMp: { type: integer, minimum: 0 }
        gold: { type: integer, minimum: 0 }
        level: { type: integer, minimum: 1 }
        exp: { type: integer, minimum: 0 }
        weapon: { type: integer, minimum: 0, description: 무기 단계 }
        position: { type: integer, minimum: 0, description: 보드 칸 번호 }
        updatedAt: { type: string, format: date-time, readOnly: true }
    Tile:
      type: object
      required: [id, type, nameKey]
      properties:
        id: { type: integer, description: 보드 칸 번호(0부터) }
        type: { type: string, enum: [START, CITY, EVENT, BATTLE, BOSS, JAIL] }
        nameKey: { type: string, description: 프론트 messages 의 번역 키 }
    Foe:
      type: object
      required: [id, hp, attackMin, attackMax, rewardMin, rewardMax, exp]
      properties:
        id: { type: string, example: monster }
        hp: { type: integer }
        attackMin: { type: integer }
        attackMax: { type: integer }
        rewardMin: { type: integer }
        rewardMax: { type: integer }
        exp: { type: integer }
    Item:
      type: object
      required: [id, kind, nameKey, price]
      properties:
        id: { type: string }
        kind: { type: string }
        nameKey: { type: string }
        price: { type: integer }
        effect: { type: object, description: 아이템 효과(T6 에서 확정) }
    GameConfig:
      type: object
      required: [tiles, foes, rules, items]
      properties:
        tiles:
          type: array
          items: { $ref: "#/components/schemas/Tile" }
        foes:
          type: array
          items: { $ref: "#/components/schemas/Foe" }
        rules:
          type: object
          additionalProperties: { type: number }
          description: 이벤트·도시·감옥·스킬·성장 수치 (키는 snake_case)
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
