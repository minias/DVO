name: Security

# 취약 의존성 점검: 코드 변경이 없어도 새 취약점이 공개될 수 있으므로 매주 실행한다
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 운영 의존성에 high 이상 취약점이 있으면 실패 (main 병합 차단 기준)
      - name: 운영 의존성 점검 (high 이상이면 실패)
        run: npm audit --omit=dev --audit-level=high

      # 개발 의존성은 번들에 포함되지 않으므로 실패시키지 않고 결과만 보여준다
      - name: 전체 의존성 점검 (참고용)
        run: npm audit --audit-level=high
        continue-on-error: true

  dependency-review:
    name: dependency review
    # PR 이 새로 들이거나 올리는 의존성의 취약점·라이선스를 검토한다
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
