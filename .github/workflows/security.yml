name: Security

# 취약 의존성 점검: 코드 변경이 없어도 새 취약점이 공개될 수 있으므로 매주 실행한다
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/CODEOWNERS'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/CODEOWNERS'
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  # 역할(프론트·백엔드)별로 필요한 점검만 실행한다. push·schedule 은 항상 둘 다 실행한다
  changes:
    name: 변경 범위 판정
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}

    steps:
      - uses: actions/checkout@v7

      - name: 변경 범위 판정
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          frontend=true
          backend=true
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            files=$(git diff --name-only "$BASE_SHA" HEAD)
            frontend=false
            backend=false
            # 이 워크플로 자체가 바뀌면 전체를 검증한다
            if echo "$files" | grep -q '^\.github/workflows/security\.yml$'; then
              frontend=true
              backend=true
            fi
            if echo "$files" | grep -q '^frontend/'; then frontend=true; fi
            if echo "$files" | grep -q '^backend/'; then backend=true; fi
          fi
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  audit:
    name: npm audit
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      # 운영 의존성에 high 이상 취약점이 있으면 실패 (main 병합 차단 기준)
      - name: 운영 의존성 점검 (high 이상이면 실패)
        run: npm audit --omit=dev --audit-level=high

      # 개발 의존성은 번들에 포함되지 않으므로 실패시키지 않고 결과만 보여준다
      - name: 전체 의존성 점검 (참고용)
        run: npm audit --audit-level=high
        continue-on-error: true

  govulncheck:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # 백엔드가 실제로 호출하는 코드에 도달하는 취약점이 있으면 실패
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Go 취약점 점검
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  dependency-review:
    name: dependency review
    # PR 이 새로 들이거나 올리는 의존성의 취약점·라이선스를 검토한다
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
