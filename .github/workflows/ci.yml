name: CI

# Windows / macOS / Linux 에서 모두 같은 검증 게이트(check, lint, test, build)를 실행한다
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Playwright 브라우저 설치 (브라우저 테스트용)
        run: npx playwright install --with-deps chromium

      - name: 검증 게이트
        run: npm run verify
