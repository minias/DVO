name: CI

# 웹게임의 실행 환경은 브라우저(Chrome)이므로 OS 매트릭스 대신 Linux 한 곳에서
# 전체 검증 게이트(check, lint, test, build)와 Chromium 브라우저 스모크 테스트를 실행한다
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 최소 권한: 코드 읽기만 허용한다
permissions:
  contents: read

# 같은 브랜치에서 새 푸시가 오면 이전 실행을 취소해 러너 시간을 아낀다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (ubuntu + chromium)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Playwright Chromium 설치 (브라우저 스모크 테스트용)
        run: npx playwright install --with-deps chromium

      - name: 검증 게이트
        run: npm run verify
