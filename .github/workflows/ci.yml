name: CI

# 웹게임의 실행 환경은 브라우저(Chrome)이므로 OS 매트릭스 대신 Linux 한 곳에서
# 전체 검증 게이트(check, lint, test, build)와 Chromium 브라우저 스모크 테스트를 실행한다
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 최소 권한: 코드 읽기만 허용한다
permissions:
  contents: read

# 같은 브랜치에서 새 푸시가 오면 이전 실행을 취소해 러너 시간을 아낀다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 백엔드(Go) 검증. 필수 체크(verify)와 별개이며 backend/ 가 바뀌지 않아도 빠르게 끝난다
  backend:
    name: backend (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      # backend/ 가 바뀌지 않은 PR(프론트·문서 전용)은 백엔드 검증을 건너뛴다
      - name: 변경 범위 판정 (백엔드 변경 여부)
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run_backend=true
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            run_backend=false
            if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^backend/|^\.github/workflows/ci\.yml$'; then
              run_backend=true
            fi
          fi
          echo "run_backend=$run_backend" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        if: steps.scope.outputs.run_backend == 'true'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # 서식 → vet → 테스트. 로컬과 같은 `make check` 를 쓴다
      - name: 검증 게이트
        if: steps.scope.outputs.run_backend == 'true'
        run: make check

  verify:
    name: verify (ubuntu + chromium)
    runs-on: ubuntu-latest

    # 앱은 frontend/ 에 있다 (모노레포)
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      # 문서만 바뀐 PR 은 브라우저·빌드 검증을 건너뛴다.
      # 필수 체크(verify)가 보고되지 않으면 병합이 막히므로 paths-ignore 대신 단계 단위로 건너뛴다
      - name: 변경 범위 판정 (문서만 변경 여부)
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          docs_only=false
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            files=$(git diff --name-only "$BASE_SHA" HEAD)
            # 변경 파일이 모두 문서 경로이면 문서 전용으로 본다
            if [ -n "$files" ] && ! echo "$files" | grep -qvE '\.md$|^docs/|^LICENSE$|^\.github/(ISSUE_TEMPLATE/|PULL_REQUEST_TEMPLATE\.md|CODEOWNERS)'; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      # 문서 전용 변경은 서식 검사만 수행한다
      - name: 문서 서식 검사 (문서 전용 변경)
        if: steps.scope.outputs.docs_only == 'true'
        run: npx prettier --check ../README.md ../CONTRIBUTING.md ../SECURITY.md ../CODE_OF_CONDUCT.md

      - name: Playwright Chromium 설치 (브라우저 스모크 테스트용)
        if: steps.scope.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium

      - name: 검증 게이트
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run verify
